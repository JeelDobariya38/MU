spring.application.name=ComplaintManagement
server.port=8080

# XAMPP MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/complaint_db
spring.datasource.username=root
spring.datasource.password=

# Execute schema.sql every time the application starts.
spring.sql.init.mode=always

# Disable Thymeleaf template caching during development.
spring.thymeleaf.cache=false
