<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View Complaints</title>
</head>
<body>
    <h1>Complaint Management System</h1>
    <h2 th:text="${pageTitle}">All Complaints</h2>

    <p>
        <a href="/submit">Submit New Complaint</a> |
        <a href="/complaints">View All Complaints</a> |
        <a href="/pending">View Pending Complaints</a>
    </p>

    <table border="1" cellpadding="6">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Update Status</th>
                <th>Update Priority</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${complaints}">
                <td th:text="${c.id}">1</td>
                <td th:text="${c.title}">Internet issue</td>
                <td th:text="${c.description}">Description</td>
                <td th:text="${c.priority}">Medium</td>
                <td th:text="${c.status}">Pending</td>
                <td>
                    <form th:action="@{/update-status/{id}(id=${c.id})}" method="post">
                        <select name="status">
                            <option value="Pending" th:selected="${c.status == 'Pending'}">Pending</option>
                            <option value="In Progress" th:selected="${c.status == 'In Progress'}">In Progress</option>
                            <option value="Resolved" th:selected="${c.status == 'Resolved'}">Resolved</option>
                        </select>
                        <button type="submit">Update</button>
                    </form>
                </td>
                <td>
                    <form th:action="@{/update-priority/{id}(id=${c.id})}" method="post">
                        <select name="priority">
                            <option value="Low" th:selected="${c.priority == 'Low'}">Low</option>
                            <option value="Medium" th:selected="${c.priority == 'Medium'}">Medium</option>
                            <option value="High" th:selected="${c.priority == 'High'}">High</option>
                        </select>
                        <button type="submit">Update</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(complaints)}">
                <td colspan="7">No complaints found.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
