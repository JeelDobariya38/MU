<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Card with Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">
  <div class="container py-5">
    <h1 class="text-white h3 mb-4">Products Showcase</h1>
    <div class="row g-4">
      <div class="col-sm-6 col-lg-4">
        <div class="card bg-black p-2 text-white h-100 shadow-lg rounded-5">
          <img src="https://picsum.photos/seed/dripper/200/150" class="card-img-top rounded-5">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Tablet</h5>
            <p class="fs-5 fw-bold">$28.00</p>
            <button class="btn btn-primary mt-auto">
              Add to Cart
            </button>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-lg-4">
        <div class="card bg-black p-2 text-white h-100 shadow-sm rounded-5">
          <img src="https://picsum.photos/seed/paint/200/150" class="card-img-top rounded-5">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Painting</h5>
            <p class="fs-5 fw-bold">$64.00</p>
            <button class="btn btn-primary mt-auto">
              Add to Cart
            </button>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-lg-4">
        <div class="card bg-black p-2 text-white h-100 shadow-sm rounded-5">
          <img src="https://picsum.photos/seed/case/200/150" class="card-img-top rounded-5">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">School Bag</h5>
            <p class="fs-5 fw-bold">$49.00</p>
            <button class="btn btn-primary mt-auto">
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="card m-5">
    <div class="card-header bg-secondary">
      <h2 class="text-white">Your Cart &amp; Checkout</h5>
    </div>
    <div class="card-body">
      <ul class="list-group mb-4">
        <li class="list-group-item d-flex justify-content-between">
          <span>Tablet</span><span>$28.00</span>
        </li>
        <li class="list-group-item d-flex justify-content-between">
          <span>Clouds Painting</span><span>$64.00</span>
        </li>
        <li class="list-group-item d-flex justify-content-between">
          <span>School Bag</span><span>$49.00</span>
        </li>
        <li class="list-group-item d-flex justify-content-between fw-bold">
          <span>Total</span><span>$141.00</span>
        </li>
      </ul>
      <form>
        <div class="mb-3">
          <label for="name" class="form-label">Full name</label>
          <input type="text" class="form-control" id="name" placeholder="Enter name">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="Enter email">
        </div>
        <div class="mb-3">
          <label for="address" class="form-label">Address</label>
          <input type="text" class="form-control" id="address" placeholder="Enter address">
        </div>
        <div class="row g-3 mb-3">
          <div class="col-7">
            <label for="city" class="form-label">City</label>
            <input type="text" class="form-control" id="city" placeholder="Enter city">
          </div>
          <div class="col-5">
            <label for="zip" class="form-label">Postal code</label>
            <input type="text" class="form-control" id="zip" placeholder="Enter postal code">
          </div>
        </div>
        <div class="mb-3">
          <label for="card" class="form-label">Card number</label>
          <input type="text" class="form-control" id="card" placeholder="1234 5678 9012 3456">
        </div>
        <div class="row g-3 mb-4">
          <div class="col-6">
            <label for="exp" class="form-label">Expiry</label>
            <input type="text" class="form-control" id="exp" placeholder="MM/YY">
          </div>
          <div class="col-6">
            <label for="cvc" class="form-label">CVC</label>
            <input type="text" class="form-control" id="cvc" placeholder="Enter CVC">
          </div>
        </div>
        <button type="submit" class="btn btn-success w-200">Place Order</button>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
