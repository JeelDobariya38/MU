<!DOCTYPE html>
<html>

    <head>
        <title>MU - Placement</title>

        <style>
            body {
                margin: 0;
                font-family: Arial;
                background: #000000;
                color: #f4f6f9;
                font-size: 1.2rem;
            }

            .header {
                background: #1776ad;
                color: white;
                padding: 20px;
                text-align: center;
            }

            .navbar {
                background: #22136c;
                padding: 15px;
                text-align: center;
            }

            .navbar a {
                color: #f4f6f9;
                text-decoration: none;
                margin: 20px;
                font-weight: bold;
            }

            .container {
                width: 90%;
                margin: auto;
                margin-top: 40px;
            }

            .card {
                width: 15%;
                display: inline-block;
                background: #051217;
                margin: 10px;
                padding: 20px;
                text-align: center;
                border-radius: 8px;
                box-shadow: 0px 0px 50px #273c48dd;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 15px;
                background: #16474c;
            }

            table,
            th,
            td {
                border: 2px solid black;
                border-radius: 12px;
            }

            th {
                background: #224b77;
                color: white;
                padding: 12px;
            }

            td {
                padding: 10px;
                text-align: center;
            }
        </style>
    </head>

    <body>

        <div class="header">
            <h1>MU - Placement Dashboard</h1>
        </div>

        <div class="navbar">
            <a href="#">Home</a>
            <a href="#">Students</a>
            <a href="#">Companies</a>
            <a href="#">Placements</a>
            <a href="#">Logout</a>
        </div>

        <div class="container">

            <div class="card">
                <h2>250</h2>
                <p>Students</p>
            </div>

            <div class="card">
                <h2>40</h2>
                <p>Companies</p>
            </div>

            <div class="card">
                <h2>180</h2>
                <p>Placed</p>
            </div>

            <div class="card">
                <h2>72%</h2>
                <p>Placement Rate</p>
            </div>

            <table>

                <tr>
                    <th>Company</th>
                    <th>Package</th>
                    <th>Students Selected</th>
                    <th>Status</th>
                </tr>

                <tr>
                    <td>TCS</td>
                    <td>4 LPA</td>
                    <td>50</td>
                    <td>☑️ Completed</td>
                </tr>

                <tr>
                    <td>Infosys</td>
                    <td>5 LPA</td>
                    <td>35</td>
                    <td>☑️ Completed</td>
                </tr>

                <tr>
                    <td>Wipro</td>
                    <td>4.5 LPA</td>
                    <td>28</td>
                    <td>🔄 Ongoing</td>
                </tr>

                <tr>
                    <td>Microsoft</td>
                    <td>6 LPA</td>
                    <td>40</td>
                    <td>⏱️ Upcoming</td>
                </tr>

            </table>
        </div>

    </body>

</html>
