<html lang="en">
<head><title>FlexBox Exercise</title>
    <style>
        .loader {
            display: flex;
            justify-content: center;
        }

        .ball {
            width: 20px;
            height: 20px;
            background-color: #6463c9;
            border-radius: 50%;
            margin: 10px 5px 0 5px;
            animation: bounce 0.6s infinite alternate;
        }
        .ball:nth-child(2) {
            animation-delay: 0.05s;
        }
        .ball:nth-child(3) {
            animation-delay: 0.08s;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .gallery img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px;
            background-color: #162683;
        }

        .box {
            margin: 0 30px;
            padding: 30px;
            background-color: #4674b4;
            color: white;
            height: 50px;
        }
    </style>
</head>

<body style="color:#ffffff; background-color: #01052d; text-align: center;">
    <h1>Bouncing Loader</h1>
    <div class="loader">
        <div class="ball"></div><div class="ball"></div><div class="ball"></div>
    </div>
    <h1>Photo Gallery</h1>
    <div class="gallery">
        <img src="https://picsum.photos/200/150?5">
        <img src="https://picsum.photos/200/150?6">
        <img src="https://picsum.photos/200/150?7">
        <img src="https://picsum.photos/200/150?8">
        <img src="https://picsum.photos/200/150?2">
        <img src="https://picsum.photos/200/150?9">
        <img src="https://picsum.photos/200/150?3">
        <img src="https://picsum.photos/200/150?10">
    </div><br><br>
    <h1>Flex Container and Flex Child</h1>
    <div class="container">
        <div class="box">Box 1</div>
        <div class="box" style="flex-grow: 1.1;">Box 2</div>
        <div class="box" style="flex-grow: 1.2;">Box 3</div>
    </div>
</body>
</html>
