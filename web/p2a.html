<html>

    <head>
        <title>Student Form</title>
        <style>
            h1,
            input {
                text-align: center;
            }

            h1 {
                font-size: 2rem;
            }

            label {
                font-size: 1.4rem;
            }

            input,
            select,
            option,
            textarea {
                font-size: 1.2rem;
                width: 100%;
            }
        </style>
    </head>

    <body>
        <table cellspacing="16">
            <tr>
                <td colspan="3">
                    <H1>Student Form</H1>
                </td>
            </tr>
            <tr>
                <td><label>Full Name</label></td>
                <td>:</td>
                <td><input type="text" placeholder="Enter your name"></td>
            </tr>

            <tr>
                <td><label>Email</label></td>
                <td>:</td>
                <td><input type="email" placeholder="Enter your email"></td>
            </tr>

            <tr>
                <td><label>Password</label></td>
                <td>:</td>
                <td><input type="password" placeholder="********"></td>
            </tr>

            <tr>
                <td><label>Qualification</label></td>
                <td>:</td>
                <td>
                    <select>
                        <option>10 Grade</option>
                        <option>12 Grade</option>
                        <option>Under Grade</option>
                        <option>Graduated</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label>Mobile No</label></td>
                <td>:</td>
                <td><input type="text" placeholder="XXX-XXXX-XXX"></td>
            </tr>

            <tr>
                <td><label>Address</label></td>
                <td>:</td>
                <td><textarea></textarea></td>
            </tr>

            <tr>
                <td><label>Nationality</label></td>
                <td>:</td>
                <td>
                    <select>
                        <option>India</option>
                        <option>USA</option>
                        <option>France</option>
                        <option>Germany</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label>DOB</label>
                <td>:</td>
                <td><input type="date"></td>
            </tr>

            <tr>
                <td><label>Gender</label></td>
                <td>:</td>
                <td>
                    <input type="radio" name="gender" id="male" style="width: auto;"> <label for="male">Male</label>
                    <input type="radio" name="gender" id="female" style="width: auto;"> <label
                        for="female">Female</label>
                </td>
            </tr>

            <tr>
                <td><label>Passing Year</label></td>
                <td>:</td>
                <td>
                    <select>
                        <option>2017</option>
                        <option>2018</option>
                        <option>2019</option>
                        <option>2020</option>
                        <option>2021</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td colspan="3">
                    <input type="submit" name="">
                </td>
            </tr>
        </table>
    </body>

</html>
